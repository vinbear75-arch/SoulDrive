  <g transform="translate(60 310)"><rect class="root" width="270" height="94" rx="7"/><rect class="level" x="14" y="14" width="30" height="20" rx="4"/><text class="tag" x="21" y="29">L1</text><text class="title" x="58" y="39">RAG 论文精读</text><text class="leaf" x="18" y="69">方法、实验与证据结论</text></g>
  <g transform="translate(440 94)"><rect class="node" width="300" height="90" rx="7"/><rect class="level" x="14" y="14" width="30" height="20" rx="4"/><text class="tag" x="21" y="29">L2</text><text class="title" x="58" y="39">研究问题</text><text class="leaf" x="18" y="67">要解决什么，为什么重要</text></g>
  <g transform="translate(440 284)"><rect class="node" width="300" height="90" rx="7"/><rect class="level" x="14" y="14" width="30" height="20" rx="4"/><text class="tag" x="21" y="29">L2</text><text class="title" x="58" y="39">方法与证据</text><text class="leaf" x="18" y="67">检索、切片、重排与引用</text></g>
  <g transform="translate(440 494)"><rect class="node" width="300" height="90" rx="7"/><rect class="level" x="14" y="14" width="30" height="20" rx="4"/><text class="tag" x="21" y="29">L2</text><text class="title" x="58" y="39">实验比较</text><text class="leaf" x="18" y="67">设置、结果、局限与缺口</text></g>

