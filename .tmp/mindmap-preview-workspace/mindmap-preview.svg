  <g transform="translate(850 142)"><rect class="node" width="350" height="70" rx="7"/><rect class="level" x="14" y="13" width="30" height="20" rx="4"/><text class="tag" x="21" y="28">L3</text><text class="leaf" x="58" y="31">贡献与适用条件</text><text class="leaf" x="58" y="52">与基线方案的差异</text></g>
